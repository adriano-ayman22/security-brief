<script>
const TIPS=[
{ar:{t:"بطاقتك الشخصية هي هويتك داخل المؤسسة",p:"بطاقة التعريف هي أول خط دفاع للمكان. حمْلها ظاهرة طوال الوقت يساعد الجميع على التعرف على من يحق له التواجد، ويجعل أي غريب يلفت الانتباه فورًا.",l:["ضع بطاقتك ظاهرة داخل المبنى دائمًا","أبلغ فورًا عن فقدان البطاقة","!لا تعِر بطاقتك لأي شخص مهما كانت الظروف"]},en:{t:"Your ID badge is your identity on site",p:"The ID badge is the first line of defense. Wearing it visibly lets everyone recognize who is allowed to be here and makes any stranger stand out immediately.",l:["Wear your badge visibly inside the premises","Report a lost badge immediately","!Never lend your badge to anyone, whatever the reason"]}},
{ar:{t:"الزائر يُسجَّل ويُرافَق",p:"أي زائر مهما كانت صفته أو منصبه يجب أن يُسجَّل عند الاستقبال ويحمل بطاقة زائر ويرافقه موظف طوال الزيارة. المجاملة هنا قد تكلّف الكثير.",l:["تأكد من تسجيل الزائر وحمله بطاقة زائر","رافق الزائر حتى مغادرته المبنى","!لا تترك زائرًا بمفرده في أي مكان"]},en:{t:"Visitors are registered and escorted",p:"Every visitor, whatever their title, must be signed in at reception, wear a visitor badge and be accompanied for the whole visit. Politeness here can be costly.",l:["Confirm the visitor is signed in and badged","Escort the visitor until they leave the building","!Never leave a visitor alone anywhere"]}},
{ar:{t:"احذر من الدخول خلف الآخرين",p:"الدخول المتتابع خلف موظف دون تمرير البطاقة من أكثر الثغرات شيوعًا. شخص واحد يحمل صندوقًا أو يتظاهر بالانشغال قد يدخل دون أن يلاحظه أحد.",l:["مرّر بطاقتك بنفسك عند كل بوابة","اسأل بأدب أي شخص لا تعرفه يتبعك عن بطاقته","!لا تُمسك الباب لشخص غير معروف"]},en:{t:"Watch out for tailgating",p:"Following an employee through a door without swiping a badge is one of the most common gaps. One person carrying a box or looking busy can walk in unnoticed.",l:["Swipe your own badge at every gate","Politely ask any unknown person following you for their badge","!Don't hold the door for someone you don't know"]}},
{ar:{t:"مكتب نظيف وأوراق محمية",p:"الأوراق المتروكة على المكتب أو في الطابعة أو سلة المهملات قد تكشف معلومات حساسة. المستندات السرية لها قواعد حفظ وإتلاف واضحة.",l:["احفظ المستندات السرية في خزانة مغلقة بعد العمل","أتلف الأوراق الحساسة بآلة التمزيق","!لا تترك مستندات على الطابعة أو على المكتب"]},en:{t:"Clean desk, protected documents",p:"Papers left on a desk, in a printer or in a bin can reveal sensitive information. Confidential documents have clear storage and destruction rules.",l:["Lock confidential documents away after work","Shred sensitive papers","!Don't leave documents on the printer or the desk"]}},
{ar:{t:"أقفل المكتب وأمّن المفاتيح",p:"المكاتب والخزائن والمفاتيح مسؤولية من يحملها. مفتاح مفقود أو باب مفتوح قد يكون بداية حادث أمني.",l:["أقفل مكتبك عند المغادرة حتى لو لدقائق","سجّل المفاتيح في سجل التسليم","!لا تترك المفاتيح في الأدراج أو على الأبواب"]},en:{t:"Lock your office and secure your keys",p:"Offices, cabinets and keys are the responsibility of whoever holds them. A lost key or an open door can be the start of a security incident.",l:["Lock your office whenever you leave, even briefly","Log keys in the handover register","!Don't leave keys in drawers or in doors"]}},
{ar:{t:"البوابات والمركبات تحت السيطرة",p:"دخول المركبات وخروجها يجب أن يخضع لإجراءات واضحة: تحقق من الهوية وتصريح الدخول وتفتيش عند اللزوم. أي استثناء يجب أن يُعتمد رسميًا.",l:["تحقق من تصريح كل مركبة قبل دخولها","سجّل بيانات المركبات والسائقين الزائرين","!لا تفتح البوابة بناءً على مكالمة أو طلب شفهي فقط"]},en:{t:"Keep gates and vehicles under control",p:"Vehicle entry and exit must follow clear procedures: identity check, entry permit and inspection when required. Any exception must be officially approved.",l:["Check each vehicle's permit before it enters","Log visiting vehicles and drivers","!Don't open the gate on a phone call or verbal request alone"]}},
{ar:{t:"أبلغ عن كل شخص أو شيء مشبوه",p:"حقيبة متروكة، شخص يصوّر المنشأة، أو أسئلة غير معتادة عن الحراسة والمواعيد، كلها إشارات تستحق البلاغ. لا أحد سيلومك على بلاغ حسن النية.",l:["أبلغ إدارة الأمن فورًا بما تلاحظه","اذكر المكان والوقت والوصف بدقة","!لا تواجه الشخص بنفسك ولا تلمس الأغراض المشبوهة"]},en:{t:"Report any suspicious person or item",p:"An abandoned bag, someone photographing the premises, or unusual questions about guards and schedules are all signs worth reporting. No one will blame you for a good-faith report.",l:["Report to the Security Department right away","Give the place, time and a precise description","!Don't confront the person or touch suspicious items"]}},
{ar:{t:"اعرف إجراءات الطوارئ",p:"في الحريق أو الإخلاء أو أي حادث، الثواني مهمة. معرفة المخارج ونقاط التجمع وأرقام الطوارئ مسبقًا تنقذ الأرواح.",l:["احفظ أقرب مخرج طوارئ ونقطة التجمع","احفظ رقم إدارة الأمن والطوارئ","!لا تستخدم المصاعد أثناء الإخلاء"]},en:{t:"Know the emergency procedures",p:"In a fire, an evacuation or any incident, seconds matter. Knowing the exits, assembly points and emergency numbers in advance saves lives.",l:["Know your nearest exit and assembly point","Keep the Security Department and emergency numbers handy","!Don't use elevators during an evacuation"]}},
{ar:{t:"لا تتحدث عن تفاصيل العمل خارج المؤسسة",p:"الأحاديث في المقاهي والمواصلات ووسائل التواصل قد تكشف مواعيد وأماكن وأسماء ومعلومات داخلية لمن يتتبعها.",l:["تحدث في العمل فقط داخل أماكن العمل","احذر من الأسئلة المتكررة من أشخاص غير معروفين","!لا تنشر صور المنشأة أو الوثائق أو مواعيد التنقل"]},en:{t:"Don't discuss work details outside the organization",p:"Conversations in cafés, on transport and on social media can reveal schedules, places, names and internal information to anyone listening.",l:["Discuss work only in work settings","Be wary of repeated questions from unknown people","!Don't post photos of the premises, documents or travel schedules"]}},
{ar:{t:"أمن كبار المسؤولين مسؤولية الجميع",p:"مواعيد تنقل المديرين وخط سيرهم ومركباتهم معلومات حساسة. تداولها خارج الدائرة المعنية يعرّضهم ويعرّض الفريق للخطر.",l:["شارك المواعيد مع المعنيين فقط","غيّر الروتين ما أمكن عند اللزوم","!لا تعلن عن تحركات المديرين لأي جهة غير مخوّلة"]},en:{t:"Protecting senior officials is everyone's job",p:"Managers' travel times, routes and vehicles are sensitive information. Sharing them beyond the people who need to know puts them and the team at risk.",l:["Share schedules only with those concerned","Vary routines where appropriate","!Never announce movements to any unauthorized party"]}}
];

function emailHTML(tip,n,dateStr,sender){
 var F="font-family:'Segoe UI',Tahoma,Arial,sans-serif;";
 var S="font-family:Georgia,'Times New Roman',serif;";
 function rows(list,dir){return list.map(function(x){var no=x.charAt(0)==='!';var t=no?x.slice(1):x;
  var mark=no?'<span style="color:#c0392b;font-weight:bold;">&#10005;</span>':'<span style="color:#1f8a5b;font-weight:bold;">&#10003;</span>';
  var al=dir==='rtl'?'right':'left';
  return '<tr><td dir="'+dir+'" align="'+al+'" style="'+F+'font-size:14px;line-height:24px;color:#2a3440;padding:5px 0;">'+mark+'&nbsp;&nbsp;'+esc(t)+'</td></tr>'}).join('')}
 function block(l,dir,tag,num){num=(num===null)?'&#9670;':num;var al=dir==='rtl'?'right':'left';
  return '<tr><td dir="'+dir+'" align="'+al+'" style="padding:30px 32px 8px 32px;">'
  +'<table role="presentation" cellpadding="0" cellspacing="0" border="0" dir="'+dir+'"><tr><td width="32" height="32" align="center" bgcolor="#081a2c" style="border-radius:16px;color:#c9a24d;'+F+'font-weight:bold;font-size:14px;">'+num+'</td><td style="padding:0 10px;'+F+'font-size:11px;letter-spacing:'+(dir==='rtl'?'0':'3px')+';color:#a8822f;font-weight:bold;">'+tag+'</td></tr></table>'
  +'<div style="'+(dir==='rtl'?F+'font-size:22px;':S+'font-size:21px;')+'line-height:1.5;color:#081a2c;font-weight:bold;padding:12px 0 8px 0;">'+esc(l.t)+'</div>'
  +(l.p?'<div style="'+F+'font-size:'+(dir==='rtl'?'15px':'14px')+';line-height:1.9;color:#3a4654;padding-bottom:16px;white-space:pre-line;">'+esc(l.p)+'</div>':'')
  +(l.l.length?'<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f6f3ea" style="border-radius:10px;"><tr><td style="padding:12px 20px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">'+rows(l.l,dir)+'</table></td></tr></table>':'')
  +'</td></tr>'}
 return '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#e9edf2"><tr><td align="center" style="padding:0;">'
 +'<table role="presentation" width="620" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:620px;">'
 +'<tr><td align="center" bgcolor="#081a2c" style="padding:38px 24px 32px 24px;border-bottom:4px solid #c9a24d;">'
 +'<img src="https://adriano-ayman22.github.io/security-brief/1-logo.png" width="120" height="117" alt="الحمرا أويل | El Hamra Oil" style="display:block;border:0;outline:none;margin:0 auto;width:120px;height:117px;">'
 +'<div style="'+F+'font-size:20px;color:#ffffff;font-weight:bold;padding-top:16px;">الحمرا أويل</div>'
 +'<div style="'+F+'font-size:11px;letter-spacing:4px;color:#c9a24d;font-weight:bold;padding-top:8px;">SECURITY BULLETIN</div>'
 +'<div style="'+F+'font-size:30px;color:#ffffff;font-weight:bold;padding:10px 0 4px 0;">نشرة أمنية</div>'
 +'<div style="'+F+'font-size:15px;color:#b9c8d6;letter-spacing:1px;">Security Bulletin</div>'
 +'<div style="'+F+'font-size:12px;color:#b9c8d6;letter-spacing:1px;padding-top:18px;">'+esc(dateStr)+'</div></td></tr>'
 +block(tip.ar,'rtl',tip.custom?'نشرة':'نصيحة اليوم',tip.custom?null:n)
 +(tip.en?('<tr><td align="center" style="color:#c9a24d;font-size:14px;letter-spacing:8px;padding:22px 34px 0 34px;border-top:0;">&#9670; &#9670; &#9670;</td></tr>'
 +block(tip.en,'ltr',tip.custom?'BULLETIN':'TIP OF THE DAY',tip.custom?null:n)):'')
 +'<tr><td style="padding:22px 32px 30px 32px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#081a2c" style="border-radius:10px;"><tr><td align="center" style="padding:18px 20px;'+F+'font-size:14px;line-height:1.8;color:#ffffff;"><b style="color:#c9a24d;">هل لديك شك؟ أبلغ إدارة الأمن فورًا</b>'+(tip.en||!tip.custom?'<br>Suspicious? Report it to the Security Department right away.':'')+'</td></tr></table></td></tr>'
 +'<tr><td align="center" bgcolor="#f3f5f8" style="padding:22px 30px;'+F+'font-size:12px;line-height:1.8;color:#7b8794;"><b style="color:#081a2c;font-size:13px;">'+esc(sender)+'</b><br>رسالة توعوية تلقائية، يرجى عدم الرد<br>Automated awareness message. Please do not reply.<br><span style="color:#a8822f;">تصميم وتطوير: قدري أيمن<br>Designed &amp; Developed by Kadry Ayman</span></td></tr>'

var i=0,mode=1;
var d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
function ds(){return d.getDate()+' · '+(d.getMonth()+1)+' · '+d.getFullYear()}
function show(){document.getElementById('view').innerHTML=emailHTML(TIPS[i],i+1,ds(),'إدارة الأمن · Security Department');
 document.getElementById('cap').textContent='نصيحة '+(i+1)+' من '+TIPS.length+(i===doy%TIPS.length?' · نصيحة اليوم':'');
 document.getElementById('cn').textContent=(i+1)+'/'+TIPS.length}
function lines(s){return s.split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function custom(){var g=function(i){return document.getElementById(i).value};var o={custom:1,ar:{t:g('at')||'عنوان النشرة',p:g('ap'),l:lines(g('al'))}};
 if(g('et')||g('ep')||g('el'))o.en={t:g('et'),p:g('ep'),l:lines(g('el'))};return o}
function cshow(){document.getElementById('cprev').innerHTML=emailHTML(custom(),0,ds(),document.getElementById('sn').value);try{localStorage.setItem('bul',JSON.stringify(['at','ap','al','et','ep','el','sn'].map(function(i){return document.getElementById(i).value})))}catch(e){}}
function full(){return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">'+emailHTML(custom(),0,ds(),document.getElementById('sn').value)+'</body></html>'}

document.getElementById('b1').onclick=function(){cshow();note("تم تحديث المعاينة تحت");document.getElementById("cprev").scrollIntoView()};
document.getElementById('b2').onclick=function(){var h=full();if(navigator.clipboard){navigator.clipboard.writeText(h).then(function(){note('تم نسخ كود الإيميل')},function(){note('النسخ مش متاح، استخدم التحميل')})}else note('النسخ مش متاح، استخدم التحميل')};
document.getElementById('b3').onclick=function(){var b=new Blob([full()],{type:'text/html'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='nashra-amniya.html';document.body.appendChild(x);x.click();x.remove();note('تم تحميل الملف')};
try{var sv=JSON.parse(localStorage.getItem('bul')||'null');if(sv)['at','ap','al','et','ep','el','sn'].forEach(function(k,n){document.getElementById(k).value=sv[n]})}catch(e){}
var dirty={},tmr;
function mm(q){return fetch('https://api.mymemory.translated.net/get?langpair=ar|en&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){if(j.responseStatus!=200||/MYMEMORY|QUERY LENGTH/i.test(j.responseData.translatedText))throw 0;return j.responseData.translatedText}).catch(function(){return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){return j[0].map(function(x){return x[0]}).join('')})})}
function tx(s){s=s.trim();if(!s)return Promise.resolve('');var parts=s.match(/[^.!؟?\n]+[.!؟?]*/g)||[s];var ch=[],c='';parts.forEach(function(p){if((c+p).length>400){ch.push(c);c=p}else c+=p});if(c)ch.push(c);return Promise.all(ch.map(function(x){return mm(x.trim())})).then(function(r){return r.join(' ')})}
function txLines(s){return Promise.all(s.split('\n').map(function(l){l=l.trim();if(!l)return '';var no=l.charAt(0)=='!';return tx(no?l.slice(1):l).then(function(e){return (no?'!':'')+e})})).then(function(r){return r.filter(Boolean).join('\n')})}
function autoTr(force){var g=function(i){return document.getElementById(i).value},t=document.getElementById('trm');
 var jobs=[['at','et',tx],['ap','ep',tx],['al','el',txLines]].filter(function(j){return g(j[0]).trim()&&(force||!dirty[j[1]])});
 if(!jobs.length){return}t.textContent='جاري الترجمة...';
 Promise.all(jobs.map(function(j){return j[2](g(j[0])).then(function(e){document.getElementById(j[1]).value=e;dirty[j[1]]=false})})).then(function(){t.textContent='تمت الترجمة تلقائيًا. راجعها وعدّل أي كلمة في الخانات الإنجليزية';cshow()},function(){t.textContent='الترجمة مش متاحة دلوقتي، اكتب الإنجليزي بنفسك'})}
['at','ap','al'].forEach(function(i){document.getElementById(i).addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(function(){autoTr(false)},1600)})});
['et','ep','el'].forEach(function(i){document.getElementById(i).addEventListener('input',function(){dirty[i]=true})});

 document.getElementById('t1').className=m==1?'on':'';document.getElementById('t2').className=m==2?'on':'';
 document.querySelector('.nav').style.display=m==1?'flex':'none'}
